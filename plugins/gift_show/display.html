<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>礼物展示</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        /* 滚动容器 */
        .scroll-container {
            height: 100vh;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .scroll-container::-webkit-scrollbar { width: 6px; }
        .scroll-container::-webkit-scrollbar-track { background: transparent; }
        .scroll-container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
        .scroll-container::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.3); }

        /* 空状态 */
        .empty-hint {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* ============ 礼物卡片 ============ */
        .gift-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 40%, #ffffff 100%);
            border-radius: 14px;
            box-shadow: 0 2px 6px rgba(14, 165, 233, 0.08);
            position: relative;
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(14, 165, 233, 0.1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* 合并闪光 */
        .gift-card.merged-flash { animation: mergeFlash 0.5s ease-out; }
        @keyframes mergeFlash {
            0%   { box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.5), 0 2px 6px rgba(14,165,233,0.08); }
            100% { box-shadow: 0 2px 6px rgba(14,165,233,0.08); }
        }

        /* 左侧渐变条 */
        .gift-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, #38bdf8, #818cf8);
            border-radius: 14px 0 0 14px;
        }

        /* 盲盒卡片 */
        .gift-card.blind-box {
            background: linear-gradient(135deg, #fef3c7 0%, #fffbeb 40%, #ffffff 100%);
            border-color: rgba(245, 158, 11, 0.2);
        }
        .gift-card.blind-box::before {
            background: linear-gradient(180deg, #f59e0b, #ef4444);
        }

        /* 大额礼物高亮 */
        .gift-card.highlight {
            background: linear-gradient(135deg, #fce7f3 0%, #fdf2f8 40%, #ffffff 100%);
            border-color: rgba(236, 72, 153, 0.2);
        }
        .gift-card.highlight::before {
            background: linear-gradient(180deg, #ec4899, #f97316);
        }

        /* 合并次数角标 */
        .merge-badge {
            position: absolute;
            top: 6px; right: 10px;
            padding: 1px 6px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 10px;
            font-weight: 600;
            border-radius: 8px;
            line-height: 1.4;
        }

        /* 用户区 */
        .user-area {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.9);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            flex-shrink: 0;
            background: #e2e8f0;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .user-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 粉丝牌 */
        .medal-tag {
            display: inline-flex;
            align-items: center;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            background: #e2e8f0;
            color: var(--text-secondary);
        }
        .medal-tag.medal-总督 { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .medal-tag.medal-提督 { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; }
        .medal-tag.medal-舰长 { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }

        /* 日期 */
        .gift-date {
            font-size: 11px;
            color: #cbd5e1;
        }

        /* 投喂描述 */
        .gift-action {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }
        .gift-action .gift-name-text {
            color: #0284c7;
            font-weight: 500;
        }
        .gift-action .blind-tag {
            color: #d97706;
            font-weight: 500;
        }
        .gift-action .gift-total {
            color: var(--text-muted);
            font-size: 12px;
        }
        .gift-action .gift-total .amount {
            color: #059669;
            font-weight: 600;
        }

        /* 右侧：礼物区 + 时间 */
        .right-area {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
        }

        .gift-display {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .gift-img-wrapper {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gift-img {
            max-width: 44px;
            max-height: 44px;
            object-fit: contain;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.1));
        }

        .gift-emoji {
            font-size: 28px;
            line-height: 1;
        }

        .gift-count {
            font-size: 18px;
            font-weight: 800;
            color: #0369a1;
            line-height: 1;
        }
        .gift-count .x {
            font-weight: 500;
            color: #0284c7;
            font-size: 15px;
        }

        .gift-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ============ 状态条 ============ */
        .status-bar {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            font-size: 12px;
            color: var(--text-secondary);
            z-index: 100;
            transition: opacity 0.3s;
        }
        .status-bar.hidden { opacity: 0; pointer-events: none; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; }
        .status-dot.live { background: #22c55e; animation: pulse 1.5s ease-in-out infinite; }
        .status-dot.error { background: #ef4444; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>
    <!-- 状态 -->
    <div class="status-bar" id="statusBar">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">连接中...</span>
        <span id="giftCountBadge" style="display:none;margin-left:6px;padding:1px 8px;background:#f1f5f9;border-radius:10px;color:#475569;font-size:11px;"></span>
    </div>

    <!-- 礼物列表 -->
    <div class="scroll-container" id="scrollContainer">
        <div class="empty-hint" id="emptyHint">等待礼物中...</div>
    </div>

    <script>
        const _parts = window.location.pathname.split('/').filter(Boolean);
        const ROOM_ID = _parts[1] || null;
        const PLUGIN_NAME = _parts[3] || null;

        // 配置
        const POLL_INTERVAL = 1000;
        const MAX_CARDS = 100;
        const INITIAL_LOAD = 30;
        const HIGHLIGHT_COIN = 10000;

        // 运行时配置
        let CONFIG = {
            合并同用户同礼物: true,
            合并窗口秒数: 300,
            展示范围: '全部'
        };

        let lastMaxId = 0;
        let isPolling = false;
        let totalGifts = 0;

        const $container = document.getElementById('scrollContainer');
        const $empty = document.getElementById('emptyHint');
        const $statusDot = document.getElementById('statusDot');
        const $statusText = document.getElementById('statusText');
        const $statusBar = document.getElementById('statusBar');
        const $badge = document.getElementById('giftCountBadge');

        // ========== 工具 ==========
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatTime(ts) {
            if (!ts) return '';
            const num = typeof ts === 'number' ? ts : parseFloat(ts);
            if (isNaN(num)) return '';
            const d = new Date(num < 1e12 ? num * 1000 : num);
            if (isNaN(d.getTime())) return '';
            const p = n => String(n).padStart(2, '0');
            return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        }

        function formatDate(ts) {
            if (!ts) return '';
            const num = typeof ts === 'number' ? ts : parseFloat(ts);
            if (isNaN(num)) return '';
            const d = new Date(num < 1e12 ? num * 1000 : num);
            if (isNaN(d.getTime())) return '';
            const p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
        }

        function getEmoji(name) {
            const map = {
                '人气票':'🎫','小心心':'💖','小心冰淇淋':'🍦','小花花':'🌸',
                '棒棒糖':'🍭','赞啊':'👍','B坷垃':'🎁','喵喵喵':'🐱','咚咚咚':'🥁',
                '投喂':'🍖','金币':'🪙','金瓜子':'✨','粉丝团灯牌':'🚪','粉丝手幅':'🎌',
                '摸摸头':'🤗','辣条':'🌶️','节奏灯':'💡','打call':'📣','应援棒':'🔦',
                '小星星':'⭐','超级星':'🌟','甜橙':'🍊','大吉':'🎴','干杯':'🍻',
                '比心':'💗','爱心':'❤️','蛋糕':'🎂','舰长大人':'👑','总督':'👑','提督':'🎖️',
                'SC':'💬','醒目留言':'💰','大航海':'⛵','舰长':'🎖️'
            };
            for (const [k, v] of Object.entries(map)) if (name && name.includes(k)) return v;
            return '🎁';
        }

        async function queryDB(sql, params = []) {
            if (!ROOM_ID) return [];
            const resp = await fetch('/api/db/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'sql=' + encodeURIComponent(sql) + '&params=' + encodeURIComponent(JSON.stringify(params)) + '&room_id=' + encodeURIComponent(ROOM_ID)
            });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            return await resp.json();
        }

        // ========== 渲染卡片 ==========
        function renderCard(g) {
            const uid = g['用户ID'] || 0;
            const uname = escapeHtml(g['用户名'] || '匿名');
            const avatar = g['头像URL'] || '';
            const giftId = g['礼物ID'] || '';
            const giftName = escapeHtml(g['礼物名称'] || '礼物');
            const giftImgUrl = g['礼物图片URL'] || '';
            const count = g['礼物数量'] || 1;
            const total = g['总价值'] || 0;
            const isBlind = g['是否盲盒'] == 1;
            const blindName = escapeHtml(g['盲盒名称'] || '');
            const blindProfit = g['盲盒盈亏'] || 0;
            const medalName = escapeHtml(g['粉丝牌名称'] || '');
            const medalLv = g['粉丝牌等级'] || '';
            const guardLv = escapeHtml(g['舰长等级'] || '');
            const ts = g['时间戳'];
            const mergeCount = g['_mergeCount'] || 1;
            const showDate = g['_showDate'];

            // 粉丝牌
            let medalClass = 'medal-tag';
            if (guardLv === '总督') medalClass += ' medal-总督';
            else if (guardLv === '提督') medalClass += ' medal-提督';
            else if (guardLv === '舰长') medalClass += ' medal-舰长';
            const medalHtml = medalName ? `<span class="${medalClass}">${medalName}${medalLv ? 'Lv' + medalLv : ''}</span>` : '';

            // 卡片 class
            let cls = 'gift-card';
            if (isBlind) cls += ' blind-box';
            if (total >= HIGHLIGHT_COIN) cls += ' highlight';

            // 合并角标
            const mergeBadge = mergeCount > 1 ? `<div class="merge-badge">${mergeCount}次</div>` : '';

            // 日期（只在跨天时显示）
            const dateHtml = showDate ? `<span class="gift-date">${formatDate(ts)}</span>` : '';

            // 礼物图片/表情
            let giftVisual;
            if (giftId) {
                const safeName = giftName.replace(/[\\/:*?"<>|]/g, '_');
                const localFile = safeName + giftId + '.png';
                const proxyUrl = giftImgUrl ? encodeURIComponent(giftImgUrl) : '';
                const safeCdn = giftImgUrl.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                giftVisual = `<img class="gift-img" src="/gift_data/images/${encodeURIComponent(localFile)}" alt="" onerror="onGiftImgErr(this,'${safeCdn}',${proxyUrl ? 1 : 0})">`;
            } else {
                giftVisual = `<span class="gift-emoji">${getEmoji(giftName)}</span>`;
            }

            // 投喂描述
            let actionHtml = `投喂了 <span class="gift-name-text">${giftName}</span>`;
            if (isBlind && blindName) {
                actionHtml += ` <span class="blind-tag">🎲 ${blindName}</span>`;
                if (blindProfit !== 0) {
                    const sign = blindProfit > 0 ? '+' : '';
                    const color = blindProfit > 0 ? '#059669' : (blindProfit < 0 ? '#dc2626' : '#6b7280');
                    actionHtml += ` <span style="color:${color}">${sign}${(blindProfit/1000).toFixed(2)}元</span>`;
                }
            }
            if (total > 1000) {
                actionHtml += ` <span class="gift-total">共 <span class="amount">${(total/1000).toFixed(2)}</span>元</span>`;
            }

            return `
                <div class="${cls}" data-id="${g.id}" data-user="${uid}" data-gift="${giftName}" data-blind="${isBlind ? blindName : ''}" data-ts="${ts}" data-merge="${mergeCount}" data-total="${total}">
                    ${mergeBadge}
                    <div class="user-area">
                        ${avatar ? `<img class="avatar" src="/api/proxy/avatar?url=${encodeURIComponent(avatar)}" onerror="this.style.display='none'">` : '<div class="avatar" style="display:flex;align-items:center;justify-content:center;font-size:20px;background:#e2e8f0;">👤</div>'}
                        <div class="user-info">
                            <div class="user-name-row">
                                <span class="user-name">${uname}</span>
                                ${medalHtml}
                                ${dateHtml}
                            </div>
                            <div class="gift-action">${actionHtml}</div>
                        </div>
                    </div>
                    <div class="right-area">
                        <div class="gift-display">
                            <div class="gift-img-wrapper">${giftVisual}</div>
                            <div class="gift-count"><span class="x">×</span>${count}</div>
                        </div>
                        <div class="gift-time">${formatTime(ts)}</div>
                    </div>
                </div>
            `;
        }

        function onGiftImgErr(img, cdnUrl, hasCdn) {
            hasCdn = !!hasCdn;
            if (!img.dataset.fb) {
                img.dataset.fb = '1';
                const m = img.src.match(/\/(\d+)\.png$/);
                if (m && m[1] !== '0') { img.src = '/gift_data/images/' + m[1] + '.png'; return; }
            }
            if (hasCdn && !img.dataset.fc) {
                img.dataset.fc = '1';
                img.src = '/api/proxy/avatar?url=' + encodeURIComponent(cdnUrl);
                return;
            }
            const wrapper = img.parentElement;
            if (wrapper) wrapper.innerHTML = `<span class="gift-emoji">${getEmoji(img.alt || '')}</span>`;
        }

        // ========== 合并 ==========
        function findMergeTarget(gift) {
            if (!CONFIG.合并同用户同礼物) return null;
            const uid = gift['用户ID'];
            const gname = gift['礼物名称'];
            const isBlind = gift['是否盲盒'] == 1;
            const blindN = isBlind ? (gift['盲盒名称'] || '') : '';
            const ts = typeof gift['时间戳'] === 'number' ? gift['时间戳'] : parseFloat(gift['时间戳']);
            const win = CONFIG.合并窗口秒数 || 300;

            for (const card of $container.querySelectorAll('.gift-card')) {
                if (card.dataset.user !== String(uid)) continue;
                if (card.dataset.gift !== gname) continue;
                if (card.dataset.blind !== blindN) continue;
                const cardTs = parseFloat(card.dataset.ts || 0);
                if (cardTs && ts && Math.abs(ts - cardTs) <= win) return card;
            }
            return null;
        }

        function mergeInto(card, gift) {
            const newCount = gift['礼物数量'] || 1;
            const newTotal = gift['总价值'] || 0;

            const mergeN = parseInt(card.dataset.merge || '1') + 1;
            const totalV = parseInt(card.dataset.total || '0') + newTotal;
            const curCount = parseInt(card.querySelector('.gift-count').textContent.replace(/×/g, '')) || 1;

            card.dataset.merge = mergeN;
            card.dataset.total = totalV;

            // 更新角标
            const badge = card.querySelector('.merge-badge');
            if (mergeN > 1) {
                if (!badge) {
                    const b = document.createElement('div');
                    b.className = 'merge-badge';
                    card.appendChild(b);
                }
                card.querySelector('.merge-badge').textContent = mergeN + '次';
            }

            // 更新数量
            card.querySelector('.gift-count').innerHTML = `<span class="x">×</span>${curCount + newCount - 1}`;

            // 更新总价值显示
            if (totalV > 1000) {
                const actionEl = card.querySelector('.gift-action');
                if (actionEl) {
                    const oldTotal = actionEl.querySelector('.gift-total');
                    if (oldTotal) oldTotal.remove();
                    const totalHtml = ` <span class="gift-total">共 <span class="amount">${(totalV/1000).toFixed(2)}</span>元</span>`;
                    actionEl.insertAdjacentHTML('beforeend', totalHtml);
                }
            }

            // 更新时间
            card.dataset.ts = gift['时间戳'];
            const timeEl = card.querySelector('.gift-time');
            if (timeEl) timeEl.textContent = formatTime(gift['时间戳']);

            // 合并闪光动画
            card.classList.remove('merged-flash');
            void card.offsetWidth;
            card.classList.add('merged-flash');
        }

        // ========== 添加礼物 ==========
        function addCards(gifts) {
            if (!gifts.length) return;
            if ($empty) $empty.style.display = 'none';

            for (const g of gifts) {
                const target = findMergeTarget(g);
                if (target) {
                    mergeInto(target, g);
                } else {
                    $container.insertAdjacentHTML('afterbegin', renderCard(g));
                }
            }

            totalGifts += gifts.length;
            $badge.textContent = `累计 ${totalGifts}`;
            $badge.style.display = 'inline-block';

            // 超出删除
            const cards = $container.querySelectorAll('.gift-card');
            while (cards.length > MAX_CARDS) cards[cards.length - 1].remove();
        }

        // ========== 轮询 ==========
        function getRangeStartTs() {
            const now = new Date();
            if (CONFIG.展示范围 === '当天') {
                const d = new Date(); d.setHours(0,0,0,0);
                return Math.floor(d.getTime() / 1000);
            }
            if (CONFIG.展示范围 === '当月') {
                const d = new Date(); d.setDate(1); d.setHours(0,0,0,0);
                return Math.floor(d.getTime() / 1000);
            }
            return null;
        }

        async function pollOnce() {
            if (isPolling) return;
            isPolling = true;
            try {
                const startTs = getRangeStartTs();
                let sql, params;
                if (startTs) {
                    sql = 'SELECT * FROM gift WHERE id > ? AND "时间戳" >= ? ORDER BY id ASC LIMIT 50';
                    params = [lastMaxId, startTs];
                } else {
                    sql = 'SELECT * FROM gift WHERE id > ? ORDER BY id ASC LIMIT 50';
                    params = [lastMaxId];
                }
                const data = await queryDB(sql, params);
                if (data && data.length) {
                    const newMax = Math.max(...data.map(g => g.id || 0));
                    if (newMax > lastMaxId) lastMaxId = newMax;
                    addCards(data);
                    $statusDot.className = 'status-dot live';
                    $statusText.textContent = '直播中';
                    $statusBar.classList.add('hidden');
                    setTimeout(() => $statusBar.classList.remove('hidden'), 1000);
                }
            } catch (e) {
                console.error('Poll:', e);
                $statusDot.className = 'status-dot error';
                $statusText.textContent = '连接异常';
            } finally {
                isPolling = false;
            }
        }

        // ========== 初始加载 ==========
        async function loadInitial() {
            try {
                const startTs = getRangeStartTs();
                let sql, params;
                if (startTs) {
                    sql = 'SELECT * FROM gift WHERE "时间戳" >= ? ORDER BY id DESC LIMIT ?';
                    params = [startTs, INITIAL_LOAD];
                } else {
                    sql = 'SELECT * FROM gift ORDER BY id DESC LIMIT ?';
                    params = [INITIAL_LOAD];
                }
                let data = await queryDB(sql, params);

                if (data && data.length) {
                    data.reverse(); // 时间正序

                    // 合并（初始）
                    let merged = [];
                    for (const g of data) {
                        if (CONFIG.合并同用户同礼物 && merged.length) {
                            const last = merged[merged.length - 1];
                            if (last['用户ID'] === g['用户ID'] &&
                                last['礼物名称'] === g['礼物名称'] &&
                                (last['是否盲盒']==1 ? (last['盲盒名称']||'') : '') ===
                                (g['是否盲盒']==1 ? (g['盲盒名称']||'') : '')) {
                                const t1 = typeof last['时间戳']==='number' ? last['时间戳'] : parseFloat(last['时间戳']);
                                const t2 = typeof g['时间戳']==='number' ? g['时间戳'] : parseFloat(g['时间戳']);
                                if (Math.abs(t2 - t1) <= (CONFIG.合并窗口秒数 || 300)) {
                                    last['礼物数量'] = (last['礼物数量']||1) + (g['礼物数量']||1);
                                    last['总价值'] = (last['总价值']||0) + (g['总价值']||0);
                                    last['_mergeCount'] = (last['_mergeCount']||1) + 1;
                                    continue;
                                }
                            }
                        }
                        g['_mergeCount'] = 1;
                        merged.push(g);
                    }

                    // 日期标记（全部范围才显示）
                    if (CONFIG.展示范围 === '全部') {
                        const seen = {};
                        for (const g of merged) {
                            const d = formatDate(g['时间戳']);
                            if (!seen[d]) { g['_showDate'] = true; seen[d] = true; }
                            else g['_showDate'] = false;
                        }
                    }

                    lastMaxId = Math.max(...data.map(g => g.id || 0));
                    totalGifts = data.length;
                    $badge.textContent = `累计 ${totalGifts}`;
                    $badge.style.display = 'inline-block';
                    $empty.style.display = 'none';

                    $container.innerHTML = merged.map(renderCard).join('');
                    requestAnimationFrame(() => { $container.scrollTop = 0; });
                }
            } catch (e) {
                console.error('Initial:', e);
            }

            setInterval(pollOnce, POLL_INTERVAL);
            pollOnce();
        }

        // ========== 加载插件配置 ==========
        async function loadPluginConfig() {
            if (!ROOM_ID) return;
            try {
                const resp = await fetch(`/rooms/${ROOM_ID}/plugins`);
                const data = await resp.json();
                if (data.success && data.data) {
                    const plugin = (data.data.installed || data.data || []).find(p => p.name === PLUGIN_NAME);
                    if (plugin && plugin.config) {
                        const cfg = plugin.config;
                        if (typeof cfg['合并同用户同礼物'] === 'boolean') CONFIG.合并同用户同礼物 = cfg['合并同用户同礼物'];
                        if (typeof cfg['合并窗口秒数'] === 'number') CONFIG.合并窗口秒数 = cfg['合并窗口秒数'];
                        if (cfg['展示范围']) CONFIG.展示范围 = cfg['展示范围'];
                    }
                }
            } catch (e) {}
        }

        // ========== 启动 ==========
        if (!ROOM_ID) {
            $statusText.textContent = '错误: 缺少房间ID';
        } else {
            $statusDot.className = 'status-dot live';
            $statusText.textContent = '连接中';
            loadPluginConfig().then(loadInitial);
        }
    </script>
</body>
</html>
