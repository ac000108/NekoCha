<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>礼物展示</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --primary: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        html, body { height: 100%; }
        body {
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }

        .gift-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .gift-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: var(--card);
            border-radius: 8px;
            transition: background 0.2s;
        }
        .gift-row:hover { background: #f1f5f9; }

        .gift-row.anim-new { animation: slideIn 0.4s ease-out; }
        .gift-row.anim-merge { animation: flashBg 0.5s ease-out; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes flashBg {
            0%   { background: #ede9fe; }
            100% { background: var(--card); }
        }

        .g-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .g-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .g-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .g-name {
            font-weight: 600;
            font-size: 14px;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 200px;
        }

        .medal-tag {
            display: inline-flex;
            align-items: center;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            background: #e2e8f0;
            color: var(--text-secondary);
            width: fit-content;
        }
        .medal-tag.medal-总督 { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .medal-tag.medal-提督 { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; }
        .medal-tag.medal-舰长 { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }

        .g-action {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .g-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            flex-shrink: 0;
        }

        .g-visual {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .g-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 4px;
        }

        .g-count {
            font-weight: 600;
            font-size: 14px;
            color: var(--primary);
        }

        .g-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .empty-state {
            text-align: center;
            padding: 60px 24px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="gift-list" id="giftList">
        <div class="empty-state" id="emptyHint">等待礼物中...</div>
    </div>

    <script>
        const _parts = window.location.pathname.split('/').filter(Boolean);
        const ROOM_ID = _parts[1] || null;
        const PLUGIN_NAME = _parts[3] || null;

        const POLL_INTERVAL = 1000;
        const MAX_ROWS = 200;
        const INITIAL_LOAD = 50;

        let CONFIG = {
            合并同用户同礼物: true,
            合并窗口秒数: 300,
            展示范围: '全部'
        };

        let lastMaxId = 0;
        let isPolling = false;

        const $list = document.getElementById('giftList');
        const $empty = document.getElementById('emptyHint');

        // ========== 工具 ==========
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatTime(ts) {
            if (!ts) return '';
            const n = typeof ts === 'number' ? ts : parseFloat(ts);
            if (isNaN(n)) return '';
            const d = new Date(n < 1e12 ? n * 1000 : n);
            if (isNaN(d.getTime())) return '';
            const p = x => String(x).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        }

        function queryDB(sql, params = []) {
            return fetch('/api/db/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'sql=' + encodeURIComponent(sql) + '&params=' + encodeURIComponent(JSON.stringify(params)) + '&room_id=' + encodeURIComponent(ROOM_ID)
            }).then(r => r.json());
        }

        // ========== 渲染单行 ==========
        function renderRow(g, opts = {}) {
            const uid = g['用户ID'] || 0;
            const name = escapeHtml(g['用户名'] || '-');
            const avatar = g['头像URL'] || '';
            const giftId = g['礼物ID'] || '';
            const giftName = escapeHtml(g['礼物名称'] || '-');
            const cdnUrl = g['礼物图片URL'] || '';
            const count = g['礼物数量'] || 1;
            const total = g['总价值'] || 0;
            const isBlind = g['是否盲盒'] == 1;
            const blindName = escapeHtml(g['盲盒名称'] || '');
            const blindProfit = g['盲盒盈亏'] || 0;
            const medalName = escapeHtml(g['粉丝牌名称'] || '');
            const medalLv = g['粉丝牌等级'] || '';
            const guardLv = escapeHtml(g['舰长等级'] || '');
            const ts = g['时间戳'];
            const mergeN = g._mergeCount || 1;

            // 粉丝牌
            let medalHtml = '';
            if (medalName) {
                let cls = 'medal-tag';
                if (guardLv === '总督') cls += ' medal-总督';
                else if (guardLv === '提督') cls += ' medal-提督';
                else if (guardLv === '舰长') cls += ' medal-舰长';
                medalHtml = `<span class="${cls}">${medalName}${medalLv ? 'Lv' + medalLv : ''}</span>`;
            }

            // 礼物图片
            let imgHtml = '<span class="g-img" style="display:flex;align-items:center;justify-content:center;background:#f1f5f9;border-radius:4px;font-size:16px;">🎁</span>';
            if (giftId) {
                const safeName = giftName.replace(/[\\/:*?"<>|]/g, '_');
                const localFile = safeName + giftId + '.png';
                const proxyUrl = cdnUrl ? '/api/proxy/avatar?url=' + encodeURIComponent(cdnUrl) : '';
                const safeCdn = cdnUrl.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                imgHtml = `<img class="g-img" src="/gift_data/images/${encodeURIComponent(localFile)}" onerror="giftFallback(this,'${safeCdn}',${proxyUrl ? 1 : 0})">`;
            }

            // 投喂描述
            let actionText = `投喂了 ${giftName}`;
            if (isBlind && blindName) {
                actionText += ` 🎲 ${blindName}`;
                if (blindProfit !== 0) {
                    const cny = blindProfit / 1000;
                    const sign = cny > 0 ? '+' : '';
                    const color = cny > 0 ? 'var(--success)' : (cny < 0 ? 'var(--danger)' : 'var(--text-muted)');
                    actionText += ` <span style="color:${color}">${sign}${cny.toFixed(2)}元</span>`;
                }
            }
            if (total > 1000 && (isBlind ? false : true)) {
                // 非盲盒也显示总价值
            }

            const anim = opts.animClass || '';

            return `
                <div class="gift-row ${anim}" data-id="${g.id}" data-user="${uid}" data-gift="${giftName}" data-blind="${isBlind ? blindName : ''}" data-ts="${ts}" data-merge="${mergeN}">
                    ${avatar ? `<img class="g-avatar" src="/api/proxy/avatar?url=${encodeURIComponent(avatar)}" onerror="this.style.display='none'">` : '<div class="g-avatar" style="display:flex;align-items:center;justify-content:center;background:#e2e8f0;font-size:16px;">👤</div>'}
                    <div class="g-info">
                        <div class="g-name-row">
                            <span class="g-name">${name}</span>
                            ${medalHtml}
                        </div>
                        <div class="g-action">${actionText}${total > 1000 && !isBlind ? ` <span style="color:var(--text-muted);font-size:12px;">(CNY ${(total/1000).toFixed(2)})</span>` : ''}</div>
                    </div>
                    <div class="g-right">
                        <div class="g-visual">
                            ${imgHtml}
                            <span class="g-count">×${count}${mergeN > 1 ? `<span style="color:var(--text-muted);font-weight:400;font-size:12px;margin-left:2px;">(${mergeN})</span>` : ''}</span>
                        </div>
                        <div class="g-time">${formatTime(ts)}</div>
                    </div>
                </div>
            `;
        }

        function giftFallback(img, cdnUrl, hasCdn) {
            hasCdn = !!hasCdn;
            if (!img.dataset.fb) {
                img.dataset.fb = '1';
                const m = img.src.match(/\/(\d+)\.png$/);
                if (m && m[1] !== '0') { img.src = '/gift_data/images/' + m[1] + '.png'; return; }
            }
            if (hasCdn && !img.dataset.fc) {
                img.dataset.fc = '1';
                img.src = '/api/proxy/avatar?url=' + encodeURIComponent(cdnUrl);
                return;
            }
            const w = img.parentElement;
            if (w) w.innerHTML = '<span class="g-img" style="display:flex;align-items:center;justify-content:center;background:#f1f5f9;border-radius:4px;font-size:16px;">🎁</span>';
        }

        // ========== 合并 ==========
        function findMergeTarget(gift) {
            if (!CONFIG.合并同用户同礼物) return null;
            const uid = gift['用户ID'];
            const gname = gift['礼物名称'];
            const isBlind = gift['是否盲盒'] == 1;
            const blindN = isBlind ? (gift['盲盒名称'] || '') : '';
            const ts = typeof gift['时间戳'] === 'number' ? gift['时间戳'] : parseFloat(gift['时间戳']);
            const win = CONFIG.合并窗口秒数 || 300;

            for (const row of $list.querySelectorAll('.gift-row')) {
                if (row.dataset.user !== String(uid)) continue;
                if (row.dataset.gift !== gname) continue;
                if (row.dataset.blind !== blindN) continue;
                const rowTs = parseFloat(row.dataset.ts || 0);
                if (rowTs && ts && Math.abs(ts - rowTs) <= win) return row;
            }
            return null;
        }

        function mergeInto(row, gift) {
            const newCount = gift['礼物数量'] || 1;
            const newTotal = gift['总价值'] || 0;

            const mergeN = parseInt(row.dataset.merge || '1') + 1;
            const curCountEl = row.querySelector('.g-count');
            const curCount = parseInt(curCountEl.textContent.replace(/[×()]/g, '').split('(')[0].trim()) || 1;

            row.dataset.merge = mergeN;
            row.dataset.ts = gift['时间戳'];

            // 更新 ×count 和合并次数
            curCountEl.innerHTML = `×${curCount + newCount - 1}${mergeN > 1 ? `<span style="color:var(--text-muted);font-weight:400;font-size:12px;margin-left:2px;">(${mergeN})</span>` : ''}`;

            // 更新时间
            row.querySelector('.g-time').textContent = formatTime(gift['时间戳']);

            // 合并动画
            row.classList.remove('anim-new', 'anim-merge');
            void row.offsetWidth;
            row.classList.add('anim-merge');
        }

        // ========== 添加 ==========
        function addRows(gifts) {
            if (!gifts.length) return;
            if ($empty) $empty.style.display = 'none';

            for (const g of gifts) {
                const target = findMergeTarget(g);
                if (target) {
                    mergeInto(target, g);
                } else {
                    $list.insertAdjacentHTML('afterbegin', renderRow(g, { animClass: 'anim-new' }));
                }
            }

            // 超出删除
            const rows = $list.querySelectorAll('.gift-row');
            while (rows.length > MAX_ROWS) rows[rows.length - 1].remove();
        }

        // ========== 轮询 ==========
        function getRangeStartTs() {
            const d = new Date();
            if (CONFIG.展示范围 === '当天') {
                d.setHours(0,0,0,0);
                return Math.floor(d.getTime() / 1000);
            }
            if (CONFIG.展示范围 === '当月') {
                d.setDate(1); d.setHours(0,0,0,0);
                return Math.floor(d.getTime() / 1000);
            }
            return null;
        }

        async function pollOnce() {
            if (isPolling) return;
            isPolling = true;
            try {
                const startTs = getRangeStartTs();
                let sql, params;
                if (startTs) {
                    sql = 'SELECT * FROM gift WHERE id > ? AND "时间戳" >= ? ORDER BY id ASC LIMIT 50';
                    params = [lastMaxId, startTs];
                } else {
                    sql = 'SELECT * FROM gift WHERE id > ? ORDER BY id ASC LIMIT 50';
                    params = [lastMaxId];
                }
                const data = await queryDB(sql, params);
                if (data && data.length) {
                    const newMax = Math.max(...data.map(g => g.id || 0));
                    if (newMax > lastMaxId) lastMaxId = newMax;
                    addRows(data);
                }
            } catch (e) {
                console.error('Poll:', e);
            } finally {
                isPolling = false;
            }
        }

        // ========== 初始加载 ==========
        async function loadInitial() {
            try {
                const startTs = getRangeStartTs();
                let sql, params;
                if (startTs) {
                    sql = 'SELECT * FROM gift WHERE "时间戳" >= ? ORDER BY id DESC LIMIT ?';
                    params = [startTs, INITIAL_LOAD];
                } else {
                    sql = 'SELECT * FROM gift ORDER BY id DESC LIMIT ?';
                    params = [INITIAL_LOAD];
                }
                let data = await queryDB(sql, params);

                if (data && data.length) {
                    data.reverse(); // 时间正序

                    // 初始合并
                    if (CONFIG.合并同用户同礼物) {
                        let merged = [];
                        for (const g of data) {
                            if (merged.length) {
                                const last = merged[merged.length - 1];
                                if (last['用户ID'] === g['用户ID'] &&
                                    last['礼物名称'] === g['礼物名称'] &&
                                    (last['是否盲盒']==1 ? (last['盲盒名称']||'') : '') ===
                                    (g['是否盲盒']==1 ? (g['盲盒名称']||'') : '')) {
                                    const t1 = typeof last['时间戳']==='number' ? last['时间戳'] : parseFloat(last['时间戳']);
                                    const t2 = typeof g['时间戳']==='number' ? g['时间戳'] : parseFloat(g['时间戳']);
                                    if (Math.abs(t2 - t1) <= (CONFIG.合并窗口秒数 || 300)) {
                                        last['礼物数量'] = (last['礼物数量']||1) + (g['礼物数量']||1);
                                        last['总价值'] = (last['总价值']||0) + (g['总价值']||0);
                                        last['_mergeCount'] = (last['_mergeCount']||1) + 1;
                                        continue;
                                    }
                                }
                            }
                            g._mergeCount = 1;
                            merged.push(g);
                        }
                        data = merged;
                    } else {
                        data.forEach(g => g._mergeCount = 1);
                    }

                    lastMaxId = Math.max(...data.map(g => g.id || 0));
                    $empty.style.display = 'none';
                    $list.innerHTML = data.map(g => renderRow(g)).join('');
                }
            } catch (e) {
                console.error('Initial:', e);
            }

            setInterval(pollOnce, POLL_INTERVAL);
            pollOnce();
        }

        // ========== 加载插件配置 ==========
        async function loadPluginConfig() {
            if (!ROOM_ID) return;
            try {
                const resp = await fetch(`/rooms/${ROOM_ID}/plugins`);
                const data = await resp.json();
                if (data.success && data.data) {
                    const plugin = (data.data.installed || data.data || []).find(p => p.name === PLUGIN_NAME);
                    if (plugin && plugin.config) {
                        const cfg = plugin.config;
                        if (typeof cfg['合并同用户同礼物'] === 'boolean') CONFIG.合并同用户同礼物 = cfg['合并同用户同礼物'];
                        if (typeof cfg['合并窗口秒数'] === 'number') CONFIG.合并窗口秒数 = cfg['合并窗口秒数'];
                        if (cfg['展示范围']) CONFIG.展示范围 = cfg['展示范围'];
                    }
                }
            } catch (e) {}
        }

        // ========== 启动 ==========
        if (!ROOM_ID) {
            $empty.textContent = '错误: 缺少房间ID';
        } else {
            loadPluginConfig().then(loadInitial);
        }
    </script>
</body>
</html>
